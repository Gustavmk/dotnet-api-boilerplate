name: Build and test
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
        
concurrency:
  group: ${{ github.head_ref || github.sha }}
  cancel-in-progress: true        

# give GITHUB_TOKEN write access to packages
permissions:
  contents: read
  packages: write

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  #GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  - Currently not needed, but can be used for future reference
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push container image
    # Only publish images from main or from a semver tag - never from pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
          # semver tags only apply on the main branch (via git tags); other pushes get sha/branch tags
          tags: |
            # Minimal/Short SHA tag (e.g., sha-7a1b2c3)
            type=sha,format=short
            # Full length/Long SHA tag
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Boilerplate.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
