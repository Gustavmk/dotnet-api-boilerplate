name: Build and test - SonarCloud

        
concurrency:
  group: ${{ github.head_ref || github.sha }}
  cancel-in-progress: true        

# give GITHUB_TOKEN write access to packages
permissions:
  contents: read
  packages: write

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  #GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  - Currently not needed, but can be used for future reference
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_DOTNET_ENABLE_CONCURRENT_EXECUTION: true  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft' # See 'Supported distributions' for available options
          java-version: '17'
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.x'
      - name: Install dotnet-sonarscanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
      - name: Install dotnet-coverage
        run: |
          dotnet tool install --global dotnet-coverage
          
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          path: ~/.nuget/packages
          
      - name: Build the project, run all tests and publish to SonarCloud
        run: |
          dotnet sonarscanner begin \
          /k:"gustavmk_dotnet-api-boilerplate" \
          /o:"gustavmk" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          dotnet build WebApiBoilerplate.sln --no-incremental
          dotnet-coverage collect 'dotnet test WebApiBoilerplate.sln' -f xml  -o 'coverage.xml'
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"